name: litellm

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: liteuser
      POSTGRES_PASSWORD: litepass
      POSTGRES_DB: litellm_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  proxy:
    image: ghcr.io/berriai/litellm:main-latest
    depends_on:
      - db
    environment:
      LITELLM_MASTER_KEY: sk-master-1234
      LITELLM_SALT_KEY: sk-salt-1234
      DATABASE_URL: postgresql://liteuser:litepass@db:5432/litellm_db
      LM_STUDIO_API_BASE: http://host.docker.internal:1234/v1
      OTEL_EXPORTER: otlp_grpc
      OTEL_ENDPOINT: http://host.docker.internal:4317
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yml:/app/config.yaml
      - ./litellm/custom_auth.py:/app/custom_auth.py
    command: --config=/app/config.yaml
    restart: unless-stopped

volumes:
  pg_data:
