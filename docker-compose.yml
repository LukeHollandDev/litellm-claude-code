name: litellm

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: liteuser
      POSTGRES_PASSWORD: litepass
      POSTGRES_DB: litellm_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  proxy:
    image: ghcr.io/berriai/litellm:main-latest
    depends_on:
      - db
    environment:
      LITELLM_MASTER_KEY: sk-master-1234
      LITELLM_SALT_KEY: sk-salt-1234
      DATABASE_URL: postgresql://liteuser:litepass@db:5432/litellm_db
      JWT_SECRET: secret
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yml:/app/config.yaml
      - ./custom_auth.py:/app/custom_auth.py
    command:
      - "--config=/app/config.yaml"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pg_data:
